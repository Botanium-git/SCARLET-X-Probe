name: ScarletX Probe
run-name: ScarletX Probe Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Cache RootHide Theos and SDK
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: theos
          key: roothide-theos-ios16.5-v2

      - name: Setup lightweight RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          if [ "${{ steps.theos-cache.outputs.cache-hit }}" != "true" ]; then
            git clone --depth=1 --recurse-submodules --shallow-submodules https://github.com/roothide/theos.git "$THEOS"
            mkdir -p "$THEOS/sdks"
            git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
            git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
            cp -R "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          fi
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          if ! brew list make >/dev/null 2>&1; then brew install make; fi
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          if ! command -v ldid >/dev/null 2>&1; then brew install ldid; fi
          du -sh "$THEOS"
      - name: Build RootHide package
        env:
          THEOS_PACKAGE_SCHEME: roothide
        run: |
          make -j"$(sysctl -n hw.logicalcpu)" package FINALPACKAGE=1
          find packages -type f -name '*.deb' -print

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCARLET-X-Probe-roothide
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
